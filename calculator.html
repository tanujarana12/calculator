<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="./style.css">
  <title>Calculator</title>
</head>

<body>
<div class="main-container">
  <div id="calculatorModel" >

    <!-- RESULT DIV  -->
    <div id="result">
      <input type="text" style="width: 100%;">
    </div>

    <!-- BUTTONS DIV  -->
    <div class="button-parent-container">
      <div class="button-child-container" >
        <button>AC</button>
        <button>+/-</button>
        <button>%</button>
        <button>/</button>
      </div>
      <div class="button-child-container">
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>*</button>
      </div>
      <div class="button-child-container">
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>-</button>
      </div>
      <div class="button-child-container">
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>+</button>
      </div>
      <div class="button-child-container">
        <button>00</button>
        <button>0</button>
        <button>.</button>
        <button>=</button>
      </div>
    </div>

  </div>

</div>
</body>

</html>
