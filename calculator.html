<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="./style.css">
  <title>Calculator</title>
</head>

<body>
<div class="main-container">
  <div id="calculatorModel" >

    <!-- RESULT DIV  -->
    <div id="result">
      <input id="displayInput" type="text" style="width: 100%;" >
      <!-- <input type="text" style="width: 100%;"> -->
    </div>
    

    <!-- BUTTONS DIV  -->
    <div class="button-parent-container">
      <div class="button-child-container" >
        <button class="clickButton" id="clearButton">AC</button>
        <button class="clickButton">+/-</button>
        <button class="clickButton">%</button>
        <button class="clickButton">/</button>
      </div>
      <div class="button-child-container">
        <button class="clickButton">7</button>
        <button class="clickButton">8</button>
        <button class="clickButton">9</button>
        <button class="clickButton">*</button>
      </div>
      <div class="button-child-container">
        <button class="clickButton">4</button>
        <button class="clickButton">5</button>
        <button class="clickButton">6</button>
        <button class="clickButton">-</button>
      </div>
      <div class="button-child-container">
        <button class="clickButton">1</button>
        <button class="clickButton">2</button>
        <button class="clickButton">3</button>
        <button class="clickButton">+</button>
      </div>
      <div class="button-child-container">
        <button class="clickButton">00</button>
        <button class="clickButton">0</button>
        <button class="clickButton">.</button>
        <button class="clickButton">=</button>
      </div>
    </div>

  </div>

</div>
<script src="./calculator.js"> </script>
</body>

</html>
